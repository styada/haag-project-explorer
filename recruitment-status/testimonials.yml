# HAAG Researcher Voices
# Quotes shown in the "Researcher Voices" section of /recruitment.
#
# HOW TO UPDATE:
#   1. Replace each entry's name/role/quote with a real quote from a real
#      researcher (ask permission before publishing someone's name).
#   2. Set `enabled: true` when at least the first two entries are real.
#   3. Commit and push. The section renders automatically; if `enabled: false`
#      the section is hidden entirely.
#
# > !!! The entries below are PLACEHOLDERS written to show the layout > !!!
# > !!! They must be replaced with real quotes before merging        > !!!

enabled: true

testimonials:
  - name: "[Student Name]"
    role: "CS 8903 Researcher · Fall 2025 cohort"
    quote: >-
      [PLACEHOLDER - replace with a real quote, e.g. how the student landed a
      project through the Explorer, what the working rhythm with their faculty
      advisor looked like, and one concrete outcome (paper, conference,
      portfolio piece, grad school).]
  - name: "[Student Name]"
    role: "Returning researcher · CS 6999"
    quote: >-
      [PLACEHOLDER - ideally a quote about continuing across semesters, taking
      on more ownership, leading part of a project, or mentoring a newer
      cohort member.]
  - name: "[Faculty Name]"
    role: "HAAG Faculty Affiliate"
    quote: >-
      [PLACEHOLDER - a faculty perspective: what the program did for their
      research throughput and what they look for in student applicants.]
